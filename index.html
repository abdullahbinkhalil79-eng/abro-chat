
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>ABRO CHAT</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #09090d;
      --panel: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.10);
      --muted: #9999aa;
      --accent: #a78bfa;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, #35205a55, transparent 42%),
        radial-gradient(ellipse at 100% 100%, #173c5250, transparent 40%),
        var(--bg);
      color: #f6f4ff;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 48px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(15,15,22,.76);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 100px #0008;
      overflow: hidden;
    }

    header {
      padding: 23px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed);
      color: #fff;
      font-size: 19px;
      font-weight: 900;
      box-shadow: 0 5px 28px #8b5cf655;
    }

    h1 {
      font-size: 19px;
      margin: 0 0 4px;
      letter-spacing: 1.5px;
    }

    .subtitle { color: var(--muted); font-size: 12px; }

    .status {
      font-size: 11px;
      color: #a7f3d0;
      background: #10b98118;
      border: 1px solid #10b98135;
      padding: 8px 10px;
      border-radius: 30px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      margin-right: 6px;
    }

    .identity {
      padding: 15px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .identity label { color: var(--muted); font-size: 12px; }

    input, button { font: inherit; }

    #nickname {
      min-width: 0;
      width: 100%;
      background: #ffffff08;
      color: white;
      border: 1px solid var(--border);
      padding: 11px 13px;
      border-radius: 12px;
      outline: none;
    }

    input:focus { border-color: #a78bfa88; }

    button { transition: .2s ease; }

    .save {
      border: 1px solid var(--border);
      background: #ffffff0b;
      color: white;
      border-radius: 12px;
      padding: 11px 13px;
      cursor: pointer;
    }

    .save:hover {
      background: #ffffff16;
      border-color: #a78bfa77;
    }

    .room {
      padding: 17px 22px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .room strong { font-size: 14px; }
    .room small { color: var(--muted); font-size: 11px; }

    .room-tools { padding: 0 22px 12px; }
    .room-actions { display: flex; gap: 8px; }
    .room-actions button, .private-panel button {
      border: 1px solid var(--border);
      background: #ffffff0b;
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }
    .room-actions button.active {
      background: #a78bfa26;
      border-color: #a78bfa88;
      color: #ddd6fe;
    }
    .private-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .private-panel[hidden] { display: none; }
    #roomCode {
      flex: 1;
      min-width: 140px;
      background: #ffffff08;
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      text-transform: uppercase;
    }
    #roomHelp {
      flex-basis: 100%;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    #messages {
      flex: 1;
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 12px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb {
      background: #ffffff20;
      border-radius: 10px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      padding: 35px 0;
    }

    .message {
      align-self: flex-start;
      max-width: 88%;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 14px;
      border-radius: 7px 18px 18px 18px;
      overflow-wrap: anywhere;
      animation: appear .2s ease-out;
    }

    .message.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf626, #6366f11b);
      border-color: #a78bfa55;
      border-radius: 18px 7px 18px 18px;
    }

    .meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
    }

    .sender {
      font-size: 12px;
      font-weight: 700;
      color: #c4b5fd;
    }

    .time { font-size: 10px; color: var(--muted); }

    .text {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: #ffffff04;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      background: #ffffff08;
      color: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 14px;
      outline: none;
    }

    #send {
      border: 0;
      border-radius: 15px;
      padding: 0 20px;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 22px #8b5cf626;
    }

    #send:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 26px #8b5cf655;
    }

    #send:disabled { opacity: .5; cursor: wait; }

    #notice {
      min-height: 18px;
      padding: 0 20px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    footer {
      text-align: center;
      padding: 0 12px 16px;
      color: #777786;
      font-size: 10px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {

      body { padding: 0; }
      .app {
        min-height: 100dvh;
        border-radius: 0;
        border: 0;
      }
      header { padding: 18px 16px; }
      .identity { padding: 13px 15px; }
      .room { padding-left: 16px; padding-right: 16px; }
      .room-tools { padding-left: 16px; padding-right: 16px; }
      #messages { padding-left: 15px; padding-right: 15px; }
      form { padding: 12px; }
      #send { padding: 0 16px; }
      .status { font-size: 10px; }
    }

    /* Refined glass surfaces and soft, native-feeling highlights */
    body {
      background:
        radial-gradient(ellipse at 12% 4%, rgba(139,92,246,.24), transparent 38%),
        radial-gradient(ellipse at 92% 92%, rgba(56,189,248,.12), transparent 36%),
        #09090d;
    }

    .app {
      border-color: rgba(255,255,255,.14);
      background: linear-gradient(145deg, rgba(28,25,41,.88), rgba(12,14,23,.82));
      box-shadow: 0 30px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.10),
        0 0 60px rgba(139,92,246,.08);
    }

    header, .identity, form {
      background: linear-gradient(110deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
      border-color: rgba(255,255,255,.09);
    }

    .logo {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #d8ccff 0%, #a78bfa 42%, #6d28d9 100%);
      box-shadow: 0 8px 28px rgba(139,92,246,.38),
        inset 0 1px 0 rgba(255,255,255,.55);
    }

    .logo::after {
      content: "";
      position: absolute;
      inset: 1px 1px 50%;
      border-radius: inherit;
      background: linear-gradient(rgba(255,255,255,.3), transparent);
      pointer-events: none;
    }

    .status, .room-actions button, .private-panel button, .save {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .room-actions button, .private-panel button, .save {
      border-color: rgba(255,255,255,.12);
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }

    .room-actions button:hover, .private-panel button:hover, .save:hover {
      transform: translateY(-1px);
      border-color: rgba(196,181,253,.48);
      background: rgba(255,255,255,.12);
    }

    .room-actions button.active {
      background: linear-gradient(135deg, rgba(167,139,250,.28), rgba(124,58,237,.16));
      border-color: rgba(196,181,253,.48);
      box-shadow: 0 4px 18px rgba(139,92,246,.12), inset 0 1px 0 rgba(255,255,255,.12);
    }

    #nickname, #roomCode, #messageInput {
      border-color: rgba(255,255,255,.12);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.14);
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    #nickname:focus, #roomCode:focus, #messageInput:focus {
      border-color: rgba(196,181,253,.72);
      background: rgba(255,255,255,.065);
      box-shadow: 0 0 0 3px rgba(167,139,250,.12);
    }

    .message {
      background: linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
      border-color: rgba(255,255,255,.12);
      box-shadow: 0 8px 24px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .message.mine {
      background: linear-gradient(135deg, rgba(139,92,246,.30), rgba(99,102,241,.16));
      border-color: rgba(196,181,253,.34);
      box-shadow: 0 8px 26px rgba(91,33,182,.16), inset 0 1px 0 rgba(255,255,255,.11);
    }

    #send {
      background: linear-gradient(145deg, #c4b5fd, #8b5cf6 55%, #6d28d9);
      box-shadow: 0 7px 24px rgba(124,58,237,.28), inset 0 1px 0 rgba(255,255,255,.4);
    }

    #send:hover {
      box-shadow: 0 9px 30px rgba(139,92,246,.42), inset 0 1px 0 rgba(255,255,255,.4);
    }

    button:focus-visible {
      outline: 2px solid #c4b5fd;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <h1>ABRO CHAT</h1>
          <div class="subtitle">One room. Real conversations.</div>
        </div>
      </div>
      <div class="status" id="connection">Connecting</div>
    </header>

    <section class="identity">
      <label for="nickname">YOU</label>
      <input id="nickname" maxlength="24" placeholder="Choose a nickname">
      <button class="save" id="saveName" type="button">Save</button>
    </section>

    <div class="room">
      <strong id="roomTitle">🌐 Public Lounge</strong>
      <small id="roomDescription">Everyone shares this room</small>
    </div>
    <section class="room-tools" aria-label="Chat rooms">
      <div class="room-actions">
        <button id="groupRoom" class="active" type="button">Group chat</button>
        <button id="personalRoom" type="button">Personal chat</button>
      </div>
      <div class="private-panel" id="privatePanel" hidden>
        <input id="roomCode" maxlength="24" placeholder="Enter your shared code" aria-label="Personal chat code">
        <button id="joinRoom" type="button">Connect</button>
        <button id="createRoom" type="button">Create code</button>
        <button id="copyRoomCode" type="button" hidden>Copy code</button>
        <div id="roomHelp">Create a code and share it with the person you want to chat with.</div>
      </div>
    </section>

    <section id="messages" aria-live="polite">
      <div class="empty">Loading the conversation…</div>
    </section>

    <form id="chatForm">
      <input
        id="messageInput"
        maxlength="500"
        placeholder="Write a message…"
        autocomplete="off"
        aria-label="Your message"
        required
      >
      <button id="send" type="submit">Send ↗</button>
    </form>

    <div id="notice" role="status"></div>
    <footer>Old messages are hidden after refresh, but remain on the chat server. Never share private information.</footer>
  </main>

  <script>
    // Your Supabase project configuration
    const SUPABASE_URL =
      "https://tmazfyakptuzquhqwrmb.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_pk4zCnWtmMg_3IR_fA8rkw_4wsBl8ie";

    const connectionEl = document.getElementById("connection");
    const messagesEl = document.getElementById("messages");
    const nicknameEl = document.getElementById("nickname");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("send");
    const noticeEl = document.getElementById("notice");
    const roomTitleEl = document.getElementById("roomTitle");
    const roomDescriptionEl = document.getElementById("roomDescription");
    const roomCodeEl = document.getElementById("roomCode");
    const roomHelpEl = document.getElementById("roomHelp");
    const privatePanelEl = document.getElementById("privatePanel");
    const copyRoomCodeButton = document.getElementById("copyRoomCode");

    let client = null;
    let lastSentAt = 0;
    let realtimeChannel = null;
    let activeRoomCode = null;
    let privatePanelOpen = false;
    let roomLoadId = 0;
    const displayedIds = new Set();
    const sessionStartedAt = new Date().toISOString();

    nicknameEl.value = localStorage.getItem("abro_nickname") || "";

    function showNotice(message) {
      noticeEl.textContent = message;
    }

    function getNickname() {
      return nicknameEl.value.trim().replace(/\s+/g, " ");
    }

    document.getElementById("saveName").addEventListener("click", () => {
      const name = getNickname();

      if (name.length < 1 || name.length > 24) {
        showNotice("Choose a nickname between 1 and 24 characters.");
        return;
      }

      nicknameEl.value = name;
      localStorage.setItem("abro_nickname", name);
      showNotice("Nickname saved on this device.");
      refreshMineStyles();
    });

    function refreshMineStyles() {
      document.querySelectorAll(".message").forEach(box => {
        box.classList.toggle(
          "mine",
          box.dataset.nickname === getNickname()
        );
      });
    }

    function renderMessage(item) {
      if (displayedIds.has(item.id)) return;

      displayedIds.add(item.id);

      const empty = messagesEl.querySelector(".empty");
      if (empty) empty.remove();

      const box = document.createElement("article");
      box.className = "message";
      box.dataset.id = String(item.id);
      box.dataset.nickname = item.nickname;

      if (item.nickname === getNickname()) {
        box.classList.add("mine");
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      const sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = item.nickname;

      const time = document.createElement("span");
      time.className = "time";

      const date = new Date(item.created_at);
      time.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          });

      const content = document.createElement("div");
      content.className = "text";
      content.textContent = item.message;

      meta.append(sender, time);
      box.append(meta, content);
      messagesEl.appendChild(box);

      while (messagesEl.children.length > 120) {
        const first = messagesEl.firstElementChild;
        if (first.dataset.id) {
          displayedIds.delete(Number(first.dataset.id));
        }
        first.remove();
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadRoomMessages() {
      if (!client) return;

      const requestId = ++roomLoadId;
      const requestedRoomCode = activeRoomCode;
      messagesEl.replaceChildren();
      displayedIds.clear();

      const query = client
        .from("chat_messages")
        .select("id,nickname,message,created_at")
        .gte("created_at", sessionStartedAt)
        .order("created_at", { ascending: false })
        .limit(100);
      const { data, error } = requestedRoomCode
        ? await query.eq("room_code", requestedRoomCode)
        : await query.is("room_code", null);

      if (error) throw error;
      if (requestId !== roomLoadId) return;

      if (!data || data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = requestedRoomCode
          ? "No messages here yet. Say hello!"
          : "It’s quiet here… Start the first conversation ✨";
        messagesEl.appendChild(empty);
      } else {
        data.reverse().forEach(renderMessage);
      }
    }

    function selectRoom(roomCode) {
      activeRoomCode = roomCode;
      const isPersonal = Boolean(roomCode);
      document.getElementById("groupRoom").classList.toggle("active", !isPersonal);
      document.getElementById("personalRoom").classList.toggle("active", isPersonal || privatePanelOpen);
      privatePanelEl.hidden = !privatePanelOpen;
      roomTitleEl.textContent = isPersonal
        ? `🔒 Personal chat · ${roomCode}`
        : "🌐 Public Lounge";
      roomDescriptionEl.textContent = isPersonal
        ? "Only people with this code can join"
        : "Everyone shares this room";
      messageInput.placeholder = isPersonal
        ? "Message this person…"
        : "Write a message…";
      messagesEl.replaceChildren();
      messagesEl.innerHTML = '<div class="empty">Loading the conversation…</div>';
      if (client) {
        loadRoomMessages().catch(showRoomLoadError);
      }
    }

    function showRoomLoadError(error) {
      console.error("ABRO CHAT room load error:", error);
      connectionEl.textContent = "Connection error";
      messagesEl.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Could not load messages. Check the room_code column and Supabase policies.";
      messagesEl.appendChild(empty);
      showNotice("Could not load this chat room.");
    }

    document.getElementById("groupRoom").addEventListener("click", () => {
      privatePanelOpen = false;
      selectRoom(null);
    });

    document.getElementById("personalRoom").addEventListener("click", () => {
      privatePanelOpen = !privatePanelOpen;
      privatePanelEl.hidden = !privatePanelOpen;
      document.getElementById("personalRoom").classList.toggle("active", privatePanelOpen || Boolean(activeRoomCode));
      if (!privatePanelOpen && !activeRoomCode) {
        document.getElementById("personalRoom").classList.remove("active");
      }
    });

    document.getElementById("joinRoom").addEventListener("click", () => {
      const code = roomCodeEl.value.trim().replace(/\s+/g, "").toUpperCase();
      if (code.length < 4 || code.length > 24) {
        showNotice("Enter a valid chat code (4–24 characters).");
        roomCodeEl.focus();
        return;
      }
      roomCodeEl.value = code;
      privatePanelOpen = true;
      copyRoomCodeButton.hidden = false;
      roomHelpEl.textContent = `Share this code with the other person: ${code}`;
      showNotice("Connected to the personal chat.");
      selectRoom(code);
    });

    document.getElementById("createRoom").addEventListener("click", () => {
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const randomValues = new Uint32Array(6);
      crypto.getRandomValues(randomValues);
      const code = "ABRO-" + Array.from(randomValues, value => alphabet[value % alphabet.length]).join("");
      roomCodeEl.value = code;
      copyRoomCodeButton.hidden = false;
      privatePanelOpen = true;
      roomHelpEl.textContent = `Your code is ${code}. Share it with one person to chat together.`;
      showNotice("Personal chat code created. Share it with the other person.");
      selectRoom(code);
    });

    copyRoomCodeButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(roomCodeEl.value);
        showNotice("Chat code copied.");
      } catch (error) {
        roomCodeEl.select();
        showNotice("Copy the selected code and send it to the other person.");
      }
    });

    async function startChat() {
      if (!window.supabase) {
        connectionEl.textContent = "Library error";
        showNotice("Could not load Supabase. Check your internet and refresh.");
        return;
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      realtimeChannel = client
        .channel("abro-chat-live")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "chat_messages" },
          payload => {
            if ((payload.new.room_code || null) === activeRoomCode) {
              renderMessage(payload.new);
            }
          }
        )
        .subscribe(status => {
          if (status === "SUBSCRIBED") {
            connectionEl.textContent = "Live";
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            connectionEl.textContent = "Reconnecting";
          } else if (status === "CLOSED") {
            connectionEl.textContent = "Disconnected";
          }
        });

      try {
        await loadRoomMessages();
        connectionEl.textContent = "Connected";
      } catch (error) {
        showRoomLoadError(error);
      }
    }

    document.getElementById("chatForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        if (!client) {
          showNotice("Chat is not connected yet.");
          return;
        }

        const nickname = getNickname();
        const message = messageInput.value.trim();

        if (!nickname || nickname.length > 24) {
          showNotice("Save a nickname first (1–24 characters).");
          nicknameEl.focus();
          return;
        }

        if (!message || message.length > 500) return;

        if (Date.now() - lastSentAt < 1500) {
          showNotice("Please wait a moment before sending again.");
          return;
        }

        lastSentAt = Date.now();
        sendButton.disabled = true;

        try {
          localStorage.setItem("abro_nickname", nickname);

          const { error } = await client
            .from("chat_messages")
            .insert([{ nickname, message, room_code: activeRoomCode }]);

          if (error) throw error;

          messageInput.value = "";
          showNotice("");
        } catch (error) {
          console.error("Message send error:", error);
          showNotice("Message could not be sent. Please try again.");
          lastSentAt = 0;
        } finally {
          sendButton.disabled = false;
          messageInput.focus();
        }
      }
    );

    startChat();
  </script>
</body>
</html>
